<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Јев Мејл-Тријаж</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M18 5 8 18h7l-1 9 10-13h-7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5fb;--surface:#fff;--fg:#141827;--mut:#667085;--bd:#e6e8f0;--brand:#4f46e5;--brand-soft:#eef0ff;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);
--urgent:#e5372b;--today:#e8710a;--routine:#2f6fed;--info:#0f9d8a;--spam:#8b93a7}
@media(prefers-color-scheme:dark){:root{--bg:#0d1019;--surface:#161b28;--fg:#e9edf6;--mut:#9aa3b8;--bd:#262d3f;--brand:#8b84ff;--brand-soft:#1e2140;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hd{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4338ca);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;fill:#fff}
.hd h1{font-size:17px;margin:0;line-height:1.1}.hd small{color:var(--mut);font-size:12px}
.pill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600;white-space:nowrap}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.side{position:sticky;top:76px}@media(max-width:820px){.side{position:static}}
.panel h2{font-size:14px;margin:0 0 4px}.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.hint code{background:var(--brand-soft);color:var(--brand);padding:1px 5px;border-radius:5px;font-size:12px}
textarea{width:100%;min-height:220px;resize:vertical;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--surface);color:var(--fg);cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:var(--brand-soft)}button:active{transform:scale(.97)}
button.p{background:var(--brand);border-color:var(--brand);color:#fff;flex:1}button.p:hover{filter:brightness(1.08);background:var(--brand)}
.safe{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:24px;line-height:1.1}.tile span{color:var(--mut);font-size:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;color:var(--mut)}
.seg button.on{background:var(--brand);color:#fff}.seg i{font-style:normal;opacity:.75;margin-left:4px}
.card{--c:var(--routine);background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:40px 1fr auto;gap:12px;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);display:grid;place-items:center;font-size:18px}
.subj{font-weight:650;line-height:1.3}.from{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.chip.n{background:var(--bg);color:var(--mut);border:1px solid var(--bd)}.chip.h{background:#fff3e0;color:#b45309}
@media(prefers-color-scheme:dark){.chip.h{background:#3a2a10;color:#fbbf24}}
.why{color:var(--mut);font-size:13px}
.fix{margin-top:8px;font-size:12.5px;color:var(--mut)}
select{font:inherit;font-size:12.5px;padding:3px 6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
.conf{text-align:center;min-width:52px}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700}
.conf small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.empty{text-align:center;color:var(--mut);padding:40px 12px}
@media(max-width:480px){.card{grid-template-columns:40px 1fr}.conf{grid-column:2;display:flex;align-items:center;gap:8px;text-align:left}}
</style>
</head>
<body>
<header><div class="hd">
<div class="logo"><svg viewBox="0 0 32 32"><path d="M18 5 8 18h7l-1 9 10-13h-7z"/></svg></div>
<div><h1>Јев</h1><small>Брз тријаж на мејлови</small></div>
<span class="pill" id="cfg">…</span>
</div></header>
<main>
<section class="panel side">
<h2>Влезни мејлови</h2>
<p class="hint">Еден мејл по линија: <code>Од | Наслов | Текст</code></p>
<textarea id="in" spellcheck="false">shop@promo.example | You are a WINNER! Free gift inside | Click to claim, unsubscribe below
cto@firma.mk | URGENT: production is down | Customers cannot log in since 9am, please reply ASAP
ana@firma.mk | Може ли состанок во четврток? | Дали можеш да потврдиш термин?
no-reply@bank.example | Your monthly statement | Notification: your statement is ready
lawyer@firm.example | Contract amendment for review | Please review the attached договор before Friday
friend@mail.example | Hey | Long time no see, what's up</textarea>
<div class="btns"><button class="p" id="go">⚡ Тријажирај</button><button id="gm">Gmail</button></div>
<div class="safe">🛡 Јев само предлага. Не брише и не праќа мејлови; под прагот на сигурност одлуката е на тебе.</div>
</section>
<section>
<div class="tiles" id="stats"></div>
<div class="seg" id="seg"><button data-t="all" class="on">Сите<i id="n-all">0</i></button><button data-t="human">За човек<i id="n-human">0</i></button></div>
<div id="out"></div>
</section>
</main>
<script>
const COL={urgent:'var(--urgent)',reply_today:'var(--today)',routine:'var(--routine)',info:'var(--info)',spam:'var(--spam)'};
const NAME={urgent:'Хитно',reply_today:'Одговори денес',routine:'Рутинско',info:'Информативно',spam:'Спам'};
const ICON={urgent:'🔥',reply_today:'↩',routine:'📋',info:'📰',spam:'🚫'};
const ACT={reply:'Одговори',delegate:'Делегирај',archive:'Архивирај',snooze:'Одложи',delete:'Избриши (со потврда)'};
const ORDER=['urgent','reply_today','routine','info','spam'];
const THRESHOLD=80;
function heuristic(e){const t=(e.from+' '+e.subject+' '+e.body).toLowerCase(),has=(...w)=>w.some(x=>t.includes(x));let r;
 if(has('unsubscribe','winner','free gift','lottery','crypto giveaway','одјави'))r=['spam','delete',88,'Typical promotional/spam wording.'];
 else if(has('urgent','asap','deadline today','immediately','хитно','outage','down'))r=['urgent','reply',84,'Contains urgency markers.'];
 else if(has('invoice','contract','lawsuit','legal','diagnosis','договор','фактура'))r=['reply_today','reply',55,'Sensitive topic, needs a human look.'];
 else if(has('?','can you','could you','please','дали можеш'))r=['reply_today','reply',78,'Direct question to you.'];
 else if(has('newsletter','receipt','no-reply','noreply','digest','notification'))r=['info','archive',90,'Automated informational message.'];
 else r=['routine','snooze',60,'No clear signal.'];
 return{id:e.id,category:r[0],action:r[1],confidence:r[2],reason:r[3],needsHuman:r[2]<THRESHOLD||r[1]==='delete',ms:0}}
let emails=[],results=[],tab='all',server=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('cfg').textContent=`ДЕМО · симулација · праг ${THRESHOLD}%`;
fetch('/api/config').then(r=>r.json()).then(c=>{server=true;$('cfg').textContent=c.ai?`Claude · праг ${c.threshold}%${c.gmail?' · Gmail':''}`:`ДЕМО · без API-клуч · праг ${c.threshold}%`}).catch(()=>{});
const parse=()=>$('in').value.split('\n').filter(l=>l.trim()).map((l,i)=>{const[p0='',p1='',...r]=l.split('|').map(s=>s.trim());return{id:'m'+i,from:p0,subject:p1,body:r.join(' | ')}});
async function run(list){if(!list.length)return;let d;if(server){const r=await fetch('/api/triage',{method:'POST',body:JSON.stringify({emails:list})});d=await r.json();if(d.error)return alert(d.error)}else d=list.map(heuristic);emails=list;results=d;render()}
function render(){
  const by=Object.fromEntries(emails.map(e=>[e.id,e]));
  const human=results.filter(r=>r.needsHuman).length,auto=results.length-human;
  const avg=results.length?Math.round(results.reduce((s,r)=>s+r.ms,0)/results.length):0;
  const urgent=results.filter(r=>r.category==='urgent').length;
  $('stats').innerHTML=[[results.length,'Вкупно'],[urgent,'Хитни'],[auto,'Автоматски'],[human,'За човек']].map(([n,l])=>`<div class="tile"><b>${n}</b><span>${l}</span></div>`).join('');
  $('n-all').textContent=results.length;$('n-human').textContent=human;
  const rs=results.filter(r=>tab==='all'||r.needsHuman).sort((a,b)=>ORDER.indexOf(a.category)-ORDER.indexOf(b.category)||b.confidence-a.confidence);
  $('out').innerHTML=rs.map((r,i)=>{const e=by[r.id];return`<article class="card" style="--c:${COL[r.category]};animation-delay:${i*40}ms">
  <div class="ic">${ICON[r.category]}</div>
  <div><div class="subj">${esc(e.subject||'(без наслов)')}</div><div class="from">${esc(e.from)}</div>
   <div class="chips"><span class="chip">${NAME[r.category]}</span><span class="chip n">→ ${ACT[r.action]}</span>${r.needsHuman?'<span class="chip h">⚠ за човек</span>':''}</div>
   <div class="why">${esc(r.reason)}</div>
   <div class="fix">Погрешно? <select data-id="${r.id}">${ORDER.map(c=>`<option value="${c}" ${c===r.category?'selected':''}>${NAME[c]}</option>`).join('')}</select></div></div>
  <div class="conf"><div class="ring" style="--p:${r.confidence}"><span>${r.confidence}%</span></div><small>сигурност</small></div></article>`}).join('')||'<div class="empty">Нема мејлови за приказ.</div>';
}
$('out').addEventListener('change',async ev=>{
  const id=ev.target.dataset.id;if(!id)return;const e=emails.find(x=>x.id===id),r=results.find(x=>x.id===id);
  if(server)await fetch('/api/feedback',{method:'POST',body:JSON.stringify({from:e.from,subject:e.subject,correct:{category:ev.target.value,action:r.action}})});
  r.category=ev.target.value;r.confidence=100;r.needsHuman=false;r.reason='Поправено од тебе.';render();
});
$('go').onclick=()=>run(parse());
$('gm').onclick=async()=>{if(!server)return alert('Gmail бара локален сервер (node server.js).');const r=await fetch('/api/gmail');const d=await r.json();if(d.error)return alert(d.error);run(d)};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));render()});
setTimeout(()=>run(parse()),300);
</script>
</body>
</html>
