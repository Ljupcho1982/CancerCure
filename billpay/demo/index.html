<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подмири</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: summary strip on top; below, inbox | pipeline + giro-slip draft. Stacks on phones. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface2:#f6f8f7; --line:#d9dfdc; --fg:#12201c; --mut:#5d6d67;
  --accent:#1f4fd6; --accent-fg:#ffffff; --accent-soft:#e3eafc;
  --ok:#0f7a4b; --ok-soft:#dcf3e7; --bad:#b3261e; --bad-soft:#fbe4e1; --skip:#6b7a74; --skip-soft:#e6ebe8; --mark:#fff0a8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 8px 24px -12px rgba(18,32,28,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#16201d; --surface2:#1b2724; --line:#2a3834; --fg:#e7efeb; --mut:#9bb0a8;
  --accent:#7f9cff; --accent-fg:#0e1513; --accent-soft:#1d2744;
  --ok:#5fd39b; --ok-soft:#12301f; --bad:#ff8f86; --bad-soft:#3a1b18; --skip:#9bb0a8; --skip-soft:#233029; --mark:#5b4b00; --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#16201d; --surface2:#1b2724; --line:#2a3834; --fg:#e7efeb; --mut:#9bb0a8;
  --accent:#7f9cff; --accent-fg:#0e1513; --accent-soft:#1d2744;
  --ok:#5fd39b; --ok-soft:#12301f; --bad:#ff8f86; --bad-soft:#3a1b18; --skip:#9bb0a8; --skip-soft:#233029; --mark:#5b4b00; --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
h1{font:700 clamp(1.9rem,4vw,2.6rem)/1 var(--display);letter-spacing:-.02em;margin:0}
.tag{color:var(--mut);margin:6px 0 0;max-width:46ch;text-wrap:balance}
.demo{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--surface);border:1px dashed var(--mut);color:var(--mut);padding:6px 10px;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 16px;min-width:0}
.stat b{display:block;font:700 1.7rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--mut)}
.main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
h2{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.inbox{display:grid;gap:8px}
.mail{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.mail:hover{border-color:var(--mut)}
.mail:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mail[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.mail .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mail .from{font:400 .78rem var(--mono);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .sub{font-weight:600}
.pill{font:500 .68rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap;flex:none}
.pill.READY{background:var(--ok-soft);color:var(--ok)}.pill.BLOCKED{background:var(--bad-soft);color:var(--bad)}.pill.SKIP{background:var(--skip-soft);color:var(--skip)}.pill.WAIT{background:var(--surface2);color:var(--mut)}.pill.PAID{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:grid;gap:18px;min-width:0}
.body{font-size:.92rem;background:var(--surface2);border-radius:8px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0;transition:background .2s,border-color .2s}
.step .n{font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;gap:6px;align-items:center}
.step .t{font-weight:600;font-size:.9rem}.step .who{font-size:.76rem;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.step.run{border-color:var(--accent);background:var(--accent-soft)}.step.run .dot{background:var(--accent);animation:pulse 1s infinite}
.step.done .dot{background:var(--ok)}.step.fail{border-color:var(--bad)}.step.fail .dot{background:var(--bad)}.step.skip{opacity:.55}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.slip{border:1.5px solid var(--fg);border-radius:6px;background:var(--surface);display:grid;grid-template-columns:repeat(6,1fr);font-family:var(--mono)}
.slip>div{padding:8px 12px;border:0 solid var(--line);border-width:0 1px 1px 0;min-width:0;overflow-wrap:anywhere}
.slip .k{display:block;font:500 .62rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.slip .v{font-size:.95rem;font-variant-numeric:tabular-nums}
.slip .head{grid-column:1/-1;background:var(--fg);color:var(--bg);font:500 .7rem var(--mono);letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;border:0}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
.slip .amount .v{font:700 1.7rem var(--display)}
.slip.void{opacity:.45;filter:grayscale(1)}
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:.9rem}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 .72rem var(--mono)}
.ic.ok{background:var(--ok-soft);color:var(--ok)}.ic.no{background:var(--bad-soft);color:var(--bad)}
.checks small{display:block;color:var(--mut)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 .92rem var(--body);border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.sec:hover{border-color:var(--mut)}
.btn:disabled{opacity:.45;cursor:default}
.note{color:var(--mut);font-size:.82rem;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.main{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:1fr}.c4,.c3,.c2{grid-column:span 6}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Подмири</h1>
      <p class="tag">Сметките од е-поштата се читаат, проверуваат и подготвуваат за плаќање. Вие само одобрувате.</p>
    </div>
    <span class="demo">Демо · ништо не се плаќа</span>
  </header>

  <section class="stats" aria-label="Резиме" id="stats"></section>

  <div class="main">
    <section aria-label="Сандаче">
      <h2>Сандаче</h2>
      <div class="inbox" id="inbox"></div>
    </section>

    <section class="panel" aria-live="polite" id="detail"></section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="pipeline.js"></script>
<script>
const CFG={maxAmount:10000,history:{EVN:1400},providers:{
  EVN:{domain:"evn.mk",account:"MK07300000000012345"},
  Vodovod:{domain:"vodovod.mk",account:"MK07200000000099887"},
  Telekom:{domain:"telekom.mk",account:"MK07210000000045511"}}};
const EMAILS=[
 {id:"1",sender:"billing@evn.mk",subject:"Сметка за струја · октомври",body:"Почитувани,\nвашата сметка за струја е достапна.\nИзнос: 1.450 ден.\nЖиро-сметка: MK07300000000012345\nПовикување на број: 2026-10-4471\nРок на плаќање: 25.10.2026"},
 {id:"2",sender:"promo@tehnomarket.mk",subject:"Само денес: 50% попуст на телевизори",body:"Ексклузивна понуда само за вас. Купи сега!"},
 {id:"3",sender:"billing@vodovod.mk",subject:"Фактура за вода",body:"Износ: 620 ден.\nЖиро-сметка: MK07200000000011111\nПовикување на број: V-889\nЗабелешка: сметката на жиро-сметка е сменета."},
 {id:"4",sender:"billing@evn.mk",subject:"Сметка за струја · дополнителна",body:"Износ: 9.800 ден.\nЖиро-сметка: MK07300000000012345\nПовикување на број: 2026-10-4999"},
 {id:"5",sender:"naplata@telekom.mk",subject:"Сметка за интернет",body:"Износ: 890 ден.\nЖиро-сметка: MK07210000000045511\nПовикување на број: T-55120"},
 {id:"6",sender:"billing@evn-mk-naplata.com",subject:"Последно известување: сметка за плаќање",body:"Платете веднаш за да избегнете исклучување.\nИзнос: 2.300 ден.\nЖиро-сметка: MK07999000000000001\nПовикување на број: 000"}];
const STEPS=[["Класификација","Брз филтер"],["Извлекување","LLM агент"],["Проверка","Безбедносни правила"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
const state={sel:"1",res:{},steps:{},busy:false,paid:{}};

function checksFor(b){
  const p=CFG.providers[b.provider],past=CFG.history[b.provider],list=[];
  list.push({ok:true,t:"Испраќачот е на листата на познати добавувачи",d:b.provider});
  const accOk=b.account===p.account;
  list.push({ok:accOk,t:accOk?"Жиро-сметката се совпаѓа со зачуваната":"Жиро-сметката не се совпаѓа",d:accOk?b.account:`Во мејлот: ${b.account} · зачувана: ${p.account}`});
  const lim=b.amount<=CFG.maxAmount;
  list.push({ok:lim,t:"Износот е под лимитот",d:`${fmt(b.amount)} од ${fmt(CFG.maxAmount)} ден.`});
  const spike=!(past&&b.amount>past*2);
  list.push({ok:spike,t:spike?"Износот е близок до претходниот":"Износот е над двојно поголем од претходниот",d:past?`Претходно: ${fmt(past)} ден.`:"Нема историја"});
  return list;
}
function analyse(e){
  const c=BillPay.classify(e,CFG.providers);
  if(!c.isBill){
    if(/сметка|фактура|плаќање/i.test(e.subject+e.body)&&/износ/i.test(e.body))
      return{status:"BLOCKED",stage:["done","skip","fail"],checks:[{ok:false,t:"Испраќачот не е на листата на познати добавувачи",d:e.sender}],bill:null};
    return{status:"SKIP",stage:["done","skip","skip"],checks:[],bill:null,reason:"Не е сметка. LLM не е повикан."};
  }
  const bill=BillPay.extractRegex(e,c.provider);
  if(!bill)return{status:"BLOCKED",stage:["done","fail","skip"],checks:[{ok:false,t:"Полињата не можеа да се прочитаат",d:""}],bill:null};
  const checks=checksFor(bill),ok=checks.every(x=>x.ok);
  return{status:ok?"READY":"BLOCKED",stage:["done","done",ok?"done":"fail"],checks,bill};
}
const LABEL={READY:"Спремно",BLOCKED:"Блокирано",SKIP:"Прескокнато",WAIT:"Чека",PAID:"Одобрено"};
function status(id){return state.paid[id]?"PAID":state.res[id]?state.res[id].status:"WAIT"}

function renderStats(){
  const r=Object.values(state.res),n=EMAILS.length;
  const llm=r.filter(x=>x.stage[1]!=="skip").length;
  const cells=[[n,"мејлови во сандачето"],[r.filter(x=>x.status==="READY").length,"спремни за одобрување"],[r.filter(x=>x.status==="BLOCKED").length,"блокирани за проверка"],[`${llm} од ${n}`,"поминаа низ LLM"]];
  $("#stats").innerHTML=cells.map(c=>`<div class="stat"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("");
}
function renderInbox(){
  $("#inbox").innerHTML=EMAILS.map(e=>{const s=status(e.id);return`<button class="mail" data-id="${e.id}" aria-current="${e.id===state.sel}">
    <span class="top"><span class="from">${esc(e.sender)}</span><span class="pill ${s}">${LABEL[s]}</span></span>
    <span class="sub">${esc(e.subject)}</span></button>`}).join("");
  document.querySelectorAll(".mail").forEach(b=>b.onclick=()=>{if(state.busy)return;state.sel=b.dataset.id;render()});
}
function highlight(e,bill){
  let t=esc(e.body);
  if(bill){[/\d[\d.,]*\s*ден\.?/i,new RegExp(esc(bill.account)),new RegExp(esc(bill.reference).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))].forEach(rx=>{t=t.replace(rx,m=>`<mark>${m}</mark>`)})}
  return t;
}
function renderDetail(){
  const e=EMAILS.find(x=>x.id===state.sel),r=state.res[e.id],st=state.steps[e.id]||(r?r.stage:["wait","wait","wait"]);
  const s=status(e.id),b=r&&r.bill,paid=state.paid[e.id];
  const stepHtml=STEPS.map((x,i)=>{const k=st[i];return`<div class="step ${k==="done"?"done":k==="run"?"run":k==="fail"?"fail":k==="skip"?"skip":""}"><span class="n"><i class="dot"></i>Чекор ${i+1}</span><span class="t">${x[0]}</span><span class="who">${k==="skip"?"не е потребен":x[1]}</span></div>`}).join("");
  const slip=`<div class="slip ${b&&r.status==="READY"||paid?"":"void"}">
    <div class="head c6"><span>Нацрт за плаќање</span><span>${paid?"одобрено · симулација":"не е платено"}</span></div>
    <div class="c4"><span class="k">Примач</span><span class="v">${b?esc(b.provider):"—"}</span></div>
    <div class="c2 amount"><span class="k">Износ</span><span class="v">${b?fmt(b.amount)+" "+(b.currency==="MKD"?"ден.":b.currency):"—"}</span></div>
    <div class="c4"><span class="k">Жиро-сметка</span><span class="v">${b?esc(b.account):"—"}</span></div>
    <div class="c2"><span class="k">Повикување на број</span><span class="v">${b?esc(b.reference):"—"}</span></div></div>`;
  const checks=r&&r.checks.length?`<ul class="checks">${r.checks.map(c=>`<li><span class="ic ${c.ok?"ok":"no"}">${c.ok?"✓":"✕"}</span><span>${esc(c.t)}${c.d?`<small>${esc(c.d)}</small>`:""}</span></li>`).join("")}</ul>`:
    `<p class="note">${r&&r.reason?esc(r.reason):"Чека обработка."}</p>`;
  const can=r&&r.status==="READY"&&!paid;
  $("#detail").innerHTML=`
    <div><h2>${esc(e.sender)}</h2><div style="font:600 1.25rem var(--display)">${esc(e.subject)}</div></div>
    <div class="body">${highlight(e,b)}</div>
    <div class="steps">${stepHtml}</div>
    ${slip}
    <div><h2>Безбедносни проверки</h2>${checks}</div>
    <div class="actions">
      <button class="btn" id="pay" ${can?"":"disabled"}>${paid?"Одобрено":"Одобри плаќање"}</button>
      <button class="btn sec" id="replay" ${state.busy?"disabled":""}>Повтори обработка</button>
      <button class="btn sec" id="all" ${state.busy?"disabled":""}>Обработи ги сите</button>
    </div>
    <p class="note">${r&&r.status==="BLOCKED"?"Блокирано плаќање бара ваша рачна проверка. Системот никогаш не плаќа сам.":"Одобрувањето е симулација. Вистинска уплата се прави само во вашата банка."}</p>`;
  $("#pay").onclick=()=>{state.paid[e.id]=true;render();toast("Симулирано одобрено. Ништо не е платено.")};
  $("#replay").onclick=()=>play([e.id]);
  $("#all").onclick=()=>play(EMAILS.map(x=>x.id));
}
function render(){renderStats();renderInbox();renderDetail()}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}
async function play(ids){
  state.busy=true;
  for(const id of ids){
    state.sel=id;const e=EMAILS.find(x=>x.id===id),r=analyse(e);
    delete state.res[id];delete state.paid[id];state.steps[id]=["wait","wait","wait"];render();
    for(let i=0;i<3;i++){
      if(r.stage[i]==="skip"){state.steps[id][i]="skip";continue}
      state.steps[id][i]="run";renderDetail();await wait(i===1?800:450);
      state.steps[id][i]=r.stage[i];renderDetail();
    }
    state.res[id]=r;delete state.steps[id];render();await wait(250);
  }
  state.busy=false;render();
}
EMAILS.forEach(e=>state.res[e.id]=analyse(e));
render();
</script>
</body>
</html>
