name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/admiring-cray-oxc09l, claude/blissful-ride-2nw2qt]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: mkdir _site && cp -r index.html src _site/ && mkdir _site/jev && cp jev-triage/public/index.html _site/jev/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
